[program:novnc]
; Bind the websocket proxy to loopback only. External access is provided
; exclusively through the oneport multiplexer on 8080; binding websockify to
; 0.0.0.0 would expose a second, unproxied path to the VNC desktop.
command=python -m websockify --web  %(ENV_RESOURCES_PATH)s/novnc/ 127.0.0.1:6901 127.0.0.1:5901
directory=%(ENV_RESOURCES_PATH)s/novnc/utils/websockify/
autostart=true
autorestart=true
redirect_stderr=true 
stdout_logfile=/var/log/supervisor/%(program_name)s.log ; log logs into file
startretries=5   ; max # of serial start failures (default 3)
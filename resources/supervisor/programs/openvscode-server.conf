[program:openvscode-server]
; OpenVSCode Server (VS Code in the browser) on port %(ENV_CS_PORT)s. Runs as
; the default `ml` user (supervisord itself runs as `ml` and cannot setuid to
; root, so a non-privileged port >= 1024 is required). Workspace root is
; /workspace (matches Desktop/workspace symlink).
;
; Auth is handled by start-openvscode-server.sh (supervisord's command= cannot
; express a conditional): when CS_REQUIRE_TOKEN=true (default) it passes
; --connection-token "$VNC_PW", so the VNC password doubles as the connection
; token (browse to http://host:8090/?tkn=<VNC_PW>); when CS_REQUIRE_TOKEN=false
; it passes --without-connection-token for open, network-isolated access.
command=/resources/scripts/start-openvscode-server.sh
priority=65
autostart=true
autorestart=true
startretries=5
redirect_stderr=true
stdout_logfile=/var/log/supervisor/%(program_name)s.log

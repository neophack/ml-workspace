[program:sogoupinyin]
; Sogou Pinyin candidate-box service. run-sogoupinyin.sh waits for the XFCE
; session and fcitx, then execs the service in the foreground; when the
; service exits (e.g. fcitx restarted and its D-Bus name vanished —
; "IpcDbus::SogouImeServerExit"), autorestart brings it back.
command=%(ENV_RESOURCES_PATH)s/scripts/run-sogoupinyin.sh
priority=60
autostart=true
autorestart=true
startretries=10
redirect_stderr=true
stdout_logfile=/var/log/supervisor/%(program_name)s.log ; log logs into file

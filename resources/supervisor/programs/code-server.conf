[program:code-server]
; code-server (VS Code in the browser) on port %(ENV_CS_PORT)s. Runs as the
; default `ml` user (supervisord itself runs as `ml` and cannot setuid to root,
; so a non-privileged port >= 1024 is required). Auth reuses the existing VNC_PW
; env var: it is passed to code-server via the PASSWORD environment variable,
; since code-server 4.x rejects --password on the command line. Workspace root is
; /workspace (matches Desktop/workspace symlink).
command=code-server --bind-addr 0.0.0.0:%(ENV_CS_PORT)s --auth password /workspace
environment=PASSWORD="%(ENV_VNC_PW)s"
priority=65
autostart=true
autorestart=true
startretries=5
redirect_stderr=true
stdout_logfile=/var/log/supervisor/%(program_name)s.log

[program:sshd]
; sshd must run as root, so supervisord (running as ml) calls the privileged
; wrapper via sudo. The wrapper fixes the config/args (no arbitrary flags),
; and resets the env internally so K8s-injected vars do not break connections.
command=sudo -n /resources/scripts/start-sshd.sh
priority=52
redirect_stderr=true 
stdout_logfile=/var/log/supervisor/%(program_name)s.log ; log logs into file
;stderr_logfile=/proc/1/fd/1 ; log error into stdout to see in docker logs
;stderr_logfile_maxbytes=0
autostart=true ; start at supervisord start (default: true)
autorestart=true ; whether/when to restart (default: unexpected) 
startretries=5   ; max # of serial start failures (default 3)